$('#tr').innerHTML=ic('user',24);
$('#tl').innerHTML=ic('back',24);
function hits(){const q=flt.q.trim().toLowerCase();return ITEMS.filter(x=>(!flt.col||x.t===flt.col)&&(!q||(x.n+' '+x.s+' '+(x.l||'')+' '+x.t).toLowerCase().includes(q)))}
function sres(){const q=flt.q.trim();$('#sr').innerHTML=q||flt.col?`<div class="list">${hits().map(row).join('')||'<p style="color:rgba(255,255,255,.7)">No results.</p>'}</div>`:recent.map((r,i)=>`<button class="hist" data-rs="${i}">${ic('hist',24)}<span>${r}</span><span data-rx="${i}" aria-label="Remove" style="flex:none;color:var(--mute)">${ic('x',20)}</span></button>`).join('')}
function go(v,bk){if(!bk&&v!==cur){stack.push(cur);if(stack.length>30)stack.shift()}cur=v;$('#tl').style.visibility=v==='home'?'hidden':'visible';const c=v.startsWith('col:'),k=c?v.slice(4):v;
$('#view').innerHTML=(k==='home'?'':`<h2 class="pt">${c?COL[k][0]:TITLES[k]}</h2>`)+(c?V.col(k):V[k]());
document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.go===(c?'library':k)));
if(c){const f=()=>{const a=$('#fc')?$('#fc').value:'',l=$('#fl')?$('#fl').value:'';const q=$('#cf')?$('#cf').value.trim().toLowerCase():'',d=$('#so')&&$('#so').value==='za'?-1:1;let L2=ITEMS.filter(x=>x.t===k&&(!a||x.c===a)&&(!l||x.l===l)&&(!q||x.n.toLowerCase().includes(q)));if(k==='bibles'){$('#cl').innerHTML=L2.map(row).join('')||'<p style="color:rgba(255,255,255,.7)">No matches. Try another filter.</p>'}else{L2.sort((x,y)=>d*x.n.localeCompare(y.n,'en',{sensitivity:'base'}));let h='',P='',ls=[];L2.forEach(x=>{let c=x.n.trim()[0].toUpperCase();if(!/[A-Z]/.test(c))c='#';if(c!==P){P=c;ls.push(c);h+=`<h3 class="ltr" id="L${c}">${c}</h3>`}h+=row(x)});$('#cl').innerHTML=h||'<p style="color:rgba(255,255,255,.7)">No matches.</p>';$('#jb').innerHTML=ls.map(c=>`<button class="lt" data-l="${c}">${c}</button>`).join('')}};f();if($('#fc'))$('#fc').onchange=$('#fl').onchange=f;if($('#cf')){$('#cf').oninput=f;$('#so').onchange=f}}
if(k==='search'){const q=$('#q');q.value=flt.q;$('#sc').value=flt.col;sres();q.oninput=()=>{flt.q=q.value;sres()};q.onkeydown=e=>{if(e.key==='Enter'&&q.value.trim()){recent=[q.value.trim(),...recent.filter(r=>r!==q.value.trim())].slice(0,5);put('slb-recent',recent);q.blur()}};$('#qx').onclick=()=>{flt.q='';q.value='';sres()};$('#sc').onchange=e=>{flt.col=e.target.value;sres()}}
scrollTo(0,0)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);const lt=e.target.closest('[data-l]');if(lt){const t=document.getElementById('L'+lt.dataset.l);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return}
const it=e.target.closest('[data-it]');if(it){const id=it.dataset.it;opened=[id,...opened.filter(x=>x!==id)].slice(0,12);put('slb-opened',opened)}
const sv=e.target.closest('[data-sv]');if(sv){svTab=sv.dataset.sv;return go('saved',true)}
const sh=e.target.closest('[data-sh]');if(sh){const z=ITEMS.find(y=>y.id===sh.dataset.sh);return share(z.n,z.u)}
const vs=e.target.closest('[data-vs]');if(vs){const v=VERSES[+vs.dataset.vs];return share(v[0]+' (KJV)',null,'\u201c'+v[1]+'\u201d \u2014 '+v[0]+' (KJV)')}
const ac=e.target.closest('[data-act]');if(ac){act(ac.dataset.act);return}
const b=e.target.closest('[data-bm]');if(b){const id=b.dataset.bm;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];put('slb-saved',saved);if(cur==='saved')return go('saved');const on=saved.includes(id);b.setAttribute('aria-pressed',on);b.innerHTML=ic('bm',18,on?'currentColor':'none');return}
const x=e.target.closest('[data-rx]');if(x){e.stopPropagation();recent.splice(+x.dataset.rx,1);put('slb-recent',recent);return sres()}
const r=e.target.closest('[data-rs]');if(r){flt.q=recent[+r.dataset.rs];$('#q').value=flt.q;sres()}});
$('#tl').onclick=back;$('#tr').onclick=()=>go('about');
$('#bgs').innerHTML=SLIDES.map((u,i)=>`<i style="background-image:url(${u})"${i?'':' class="on"'}></i>`).join('');
let si=0;setInterval(()=>{if(!slidesOn)return;const e=document.querySelectorAll('#bgs i');e[si].classList.remove('on');si=(si+1)%e.length;e[si].classList.add('on')},7000);
go('home');
</script>
</body>
</html>
